version: "3.8"

services:
  db:
    image: mariadb:latest
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/mysql
      - ./build/postinst.sh:/docker-entrypoint-initdb.d/postinst.sh
    ports:
      - "3306:3306"

  web:
    build:
      context: ./build
      args:
        MARIADB_PORT: 3306
    env_file:
      - .env
    init: true
    stdin_open: true
    tty: true
    depends_on:
      - db

volumes:
  db_data:
